<!DOCTYPE html>
<html>
  <head>
    <script>
      const path = window.location.pathname;
      
      const base = '/urbanflow/';
      const cleanPath = path.startsWith(base) ? path : base + path.replace(/^\//, '');

      window.history.replaceState({}, '', cleanPath);
      window.location.href = '/urbanflow/';
      
          
    </script>
  </head>
  <body>
    <p>Avvio applicazione...</p>
  </body>
</html>
