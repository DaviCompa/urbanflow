<!DOCTYPE html>
<html>
  <head>
    <script>
      // 1. Ottieni il percorso completo
      const fullPath = window.location.pathname;
      
      // 2. Se siamo su GitHub Pages, rimuovi il nome repository duplicato
      // (davicompa.github.io è già la radice, non serve ripeterlo)
      const correctedPath = fullPath.replace('/davicompa.github.io', '');
      
      // 3. Costruisci l'URL corretto
      const newUrl = window.location.origin + correctedPath;
      
      console.log("Redirecting to:", newUrl);
      window.location.href = newUrl;
    </script>
  </head>
  <body>
    <p>Reindirizzamento in corso...</p>
  </body>
</html>
