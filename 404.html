<!DOCTYPE html>
<html>
  <head>
    <script>
      // Reindirizza tutto a index.html, lasciando che Vue Router gestisca il percorso
      const segment = 1; // Modifica questo se il tuo repo è in una sottocartella

      const path = window.location.pathname.split('/').slice(segment).join('/');
      console.log("redirect to:",path);
      window.location.href = `${window.location.origin}/${path}`.replace(/\/+/g, '/');
    </script>
  </head>
  <body>
    <p>Reindirizzamento in corso...</p>
  </body>
</html>
